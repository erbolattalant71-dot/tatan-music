<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Graduation альбомын өзіңе ыңғайлы музыка платформасынан тыңда.">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Graduation — Музыка таңда</title>

  <style>
    :root {
      --background: #080808;
      --surface: #121212;
      --surface-hover: #191919;
      --border: rgba(255, 255, 255, 0.09);
      --border-hover: rgba(255, 255, 255, 0.22);
      --text: #f5f5f5;
      --muted: #929292;
      --subtle: #606060;
      --radius: 20px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: -280px;
      left: 50%;
      width: 650px;
      height: 650px;
      transform: translateX(-50%);
      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.045) 0%,
        transparent 68%
      );
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      min-height: 100svh;
      padding: 52px 24px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .content {
      width: 100%;
      animation: fadeIn 750ms ease both;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 42px;
      color: #b5b5b5;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.19em;
      text-transform: uppercase;
      text-align: center;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 22px;
      height: 1px;
      background: #484848;
    }

    .hero {
      text-align: center;
      margin-bottom: 39px;
    }

    .hero-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 30px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      background: linear-gradient(145deg, #202020, #101010);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .hero-icon svg {
      width: 32px;
      height: 32px;
      stroke: #f3f3f3;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(40px, 10vw, 58px);
      font-weight: 650;
      letter-spacing: -0.065em;
      line-height: 1.12;
      overflow-wrap: anywhere;
    }

    .hero-description {
      max-width: 340px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
      font-weight: 400;
    }

    .album-card {
      padding: 23px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(145deg, #171717, #101010);
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 32px;
    }

    .album-art {
      width: 76px;
      height: 76px;
      flex: 0 0 76px;
      border-radius: 14px;
      background: linear-gradient(145deg, #323232, #181818);
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .album-art::before {
      content: "";
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.07);
      transform: translate(22px, 22px);
    }

    .album-art svg {
      width: 30px;
      height: 30px;
      color: #dedede;
      position: relative;
      z-index: 1;
    }

    .album-details {
      min-width: 0;
      flex: 1;
    }

    .album-type {
      display: block;
      margin-bottom: 8px;
      color: var(--subtle);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .album-title {
      margin: 0;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .album-subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .section-heading {
      margin: 0 0 17px;
      color: #a3a3a3;
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.035em;
    }

    .platforms {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .platform-button {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      min-height: 68px;
      padding: 0 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      text-decoration: none;
      color: var(--text);
      transition:
        transform 220ms ease,
        background 220ms ease,
        border-color 220ms ease,
        box-shadow 220ms ease;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      touch-action: manipulation;
    }

    .platform-button:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }

    .platform-button:active {
      transform: scale(0.985);
      background: #202020;
    }

    .platform-button:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 4px;
    }

    .platform-icon {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .platform-icon svg {
      width: 27px;
      height: 27px;
    }

    .apple-icon {
      color: #f5f5f5;
    }

    .spotify-icon {
      color: #1ed760;
    }

    .platform-name {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.015em;
    }

    .arrow-icon {
      width: 18px;
      height: 18px;
      color: #777777;
      transition:
        transform 220ms ease,
        color 220ms ease;
    }

    .platform-button:hover .arrow-icon {
      transform: translate(3px, -3px);
      color: #ffffff;
    }

    .bottom-note {
      margin: 24px 0 0;
      text-align: center;
      color: var(--subtle);
      font-size: 11px;
      line-height: 1.7;
    }

    .footer {
      margin-top: 70px;
      text-align: center;
    }

    .footer-line {
      width: 28px;
      height: 1px;
      background: #383838;
      margin: 0 auto 21px;
    }

    .footer-text {
      margin: 0;
      color: #777777;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.13em;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 36px 20px 26px;
      }

      .eyebrow {
        margin-bottom: 34px;
      }

      .hero {
        margin-bottom: 32px;
      }

      .hero-icon {
        width: 68px;
        height: 68px;
        border-radius: 21px;
        margin-bottom: 26px;
      }

      .hero h1 {
        font-size: clamp(36px, 10vw, 48px);
      }

      .hero-description {
        font-size: 13px;
      }

      .album-card {
        padding: 18px;
        gap: 15px;
        margin-bottom: 27px;
      }

      .album-art {
        width: 66px;
        height: 66px;
        flex-basis: 66px;
      }

      .album-title {
        font-size: 19px;
      }

      .platform-button {
        min-height: 66px;
      }

      .footer {
        margin-top: 54px;
      }
    }

    @media (max-height: 740px) {
      .page {
        justify-content: flex-start;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <main class="page">
    <div class="content">

      <!-- Жоғарғы жазу -->
      <div class="eyebrow">
        Бір альбом · Өзің таңда
      </div>

      <!-- Негізгі бөлім -->
      <header class="hero">

        <div class="hero-icon" aria-hidden="true">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 18V5l12-2v13"></path>
            <ellipse cx="6" cy="18" rx="3" ry="2"></ellipse>
            <ellipse cx="18" cy="16" rx="3" ry="2"></ellipse>
          </svg>
        </div>

        <h1 id="main-title">Graduation</h1>

        <p class="hero-description">
          Сүйікті музыкаңды өзіңе ыңғайлы платформадан тыңда.
        </p>

      </header>

      <!-- Альбом туралы ақпарат -->
      <section class="album-card" aria-label="Альбом туралы ақпарат">

        <div class="album-art" aria-hidden="true">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 18V5l12-2v13"></path>
            <ellipse cx="6" cy="18" rx="3" ry="2"></ellipse>
            <ellipse cx="18" cy="16" rx="3" ry="2"></ellipse>
          </svg>
        </div>

        <div class="album-details">
          <span class="album-type">Альбом</span>

          <h2 class="album-title" id="album-title">
            Graduation
          </h2>

          <p class="album-subtitle">
            Музыка әлеміне бір қадам.
          </p>
        </div>

      </section>

      <!-- Музыка платформалары -->
      <section aria-labelledby="platform-heading">

        <h2 class="section-heading" id="platform-heading">
          Тыңдайтын платформаңды таңда
        </h2>

        <nav class="platforms" aria-label="Музыка платформалары">

          <!-- Apple Music -->
          <a
            class="platform-button"
            id="apple-link"
            href="https://music.apple.com/kz/album/graduation/1451901307"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Graduation альбомын Apple Music платформасында ашу"
          >

            <span class="platform-icon apple-icon" aria-hidden="true">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path d="M20.2 2.6 9.4 4.8c-.7.1-1.1.5-1.1 1.2v11.1c-.6-.3-1.3-.4-2.1-.3-2.2.3-3.8 1.8-3.8 3.4 0 1.5 1.5 2.5 3.5 2.2 2.1-.3 3.7-1.8 3.7-3.5V9.2l8.8-1.8v7.2c-.6-.3-1.3-.4-2.1-.3-2.2.3-3.8 1.8-3.8 3.4 0 1.5 1.5 2.5 3.5 2.2 2.1-.3 3.7-1.8 3.7-3.5V3.7c0-.9-.7-1.3-1.6-1.1Z"></path>
              </svg>
            </span>

            <span class="platform-name">Apple Music</span>

            <svg
              class="arrow-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M7 17 17 7"></path>
              <path d="M8 7h9v9"></path>
            </svg>

          </a>

          <!-- Spotify -->
          <a
            class="platform-button"
            id="spotify-link"
            href="https://open.spotify.com/album/4SZko61aMnmgvNhfhgTuD3?si=jra0XHNqT66WVvyB_70Ffg"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Graduation альбомын Spotify платформасында ашу"
          >

            <span class="platform-icon spotify-icon" aria-hidden="true">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path d="M12 1.5C6.2 1.5 1.5 6.2 1.5 12S6.2 22.5 12 22.5 22.5 17.8 22.5 12 17.8 1.5 12 1.5Zm4.8 15.3a.68.68 0 0 1-.94.22c-2.6-1.59-5.87-1.95-9.72-1.07a.69.69 0 0 1-.82-.52.69.69 0 0 1 .52-.82c4.21-.96 7.82-.54 10.74 1.24.32.2.42.62.22.95Zm1.29-2.87a.86.86 0 0 1-1.18.28c-2.98-1.83-7.52-2.35-11.04-1.29a.86.86 0 0 1-.49-1.65c4.02-1.2 9.02-.62 12.44 1.48.4.25.53.78.27 1.18Zm.11-2.99C14.63 8.82 8.74 8.61 5.34 9.64a1.03 1.03 0 1 1-.6-1.97c3.9-1.18 10.42-.95 14.52 1.49a1.03 1.03 0 1 1-1.06 1.78Z"></path>
              </svg>
            </span>

            <span class="platform-name">Spotify</span>

            <svg
              class="arrow-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M7 17 17 7"></path>
              <path d="M8 7h9v9"></path>
            </svg>

          </a>

        </nav>

        <p class="bottom-note">
          Таңдаған платформаң жаңа бетте ашылады.
        </p>

      </section>

      <!-- Төменгі жазу -->
      <footer class="footer">
        <div class="footer-line" aria-hidden="true"></div>

        <p class="footer-text">
          Жақындат · Таңда · Тыңда
        </p>
      </footer>

    </div>
  </main>

  <script>
    "use strict";

    /*
      Музыка туралы негізгі деректер.
      Альбомды ауыстырғанда осы жерді өзгерту жеткілікті.
    */

    const musicConfig = {
      title: "Graduation",

      platforms: {
        appleMusic:
          "https://music.apple.com/kz/album/graduation/1451901307",

        spotify:
          "https://open.spotify.com/album/4SZko61aMnmgvNhfhgTuD3?si=jra0XHNqT66WVvyB_70Ffg"
      }
    };

    // Альбом атауын жаңарту
    document.title = `${musicConfig.title} — Музыка таңда`;

    document.getElementById("main-title").textContent =
      musicConfig.title;

    document.getElementById("album-title").textContent =
      musicConfig.title;

    // Музыка платформаларының сілтемелері
    const appleLink = document.getElementById("apple-link");
    const spotifyLink = document.getElementById("spotify-link");

    appleLink.href = musicConfig.platforms.appleMusic;
    spotifyLink.href = musicConfig.platforms.spotify;

    // Қолжетімділік үшін сілтеме атауларын жаңарту
    appleLink.setAttribute(
      "aria-label",
      `${musicConfig.title} альбомын Apple Music платформасында ашу`
    );

    spotifyLink.setAttribute(
      "aria-label",
      `${musicConfig.title} альбомын Spotify платформасында ашу`
    );
  </script>

</body>
</html>
